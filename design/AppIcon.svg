<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 48 48" fill="none">
  <!--
    SharePoint Term Store Manager app icon, the companion of SharePoint Search Explorer's icon: the same
    three-tier database at the same size and position, recoloured light purple / pink, with a tag (Fluent UI
    System Icons "tag", MIT licence, https://github.com/microsoft/fluentui-system-icons, mirrored) where Search
    Explorer has its magnifying glass, drawn the same way: light fill inside a thick dark outline.

    Geometry measured from Search Explorer's 256 px icon (scale 48/256): cylinder centre x 26.34, radii
    17.81 x 5.81; top ellipse at y 7.5, tier lines at 18.375 and 28.125, bottom at 38.25.
    Build the .png and .ico with build-icon.ps1 in this folder.
  -->
  <defs>
    <!-- Each part is lighter on the left and darker on the right, as in Search Explorer. -->
    <linearGradient id="cap" x1="8.5" x2="44.2" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6E3FF" />
      <stop offset="1" stop-color="#DDB2F7" />
    </linearGradient>
    <linearGradient id="tier1" x1="8.5" x2="44.2" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCA6F5" />
      <stop offset="1" stop-color="#B676E2" />
    </linearGradient>
    <linearGradient id="tier2" x1="8.5" x2="44.2" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B46CDD" />
      <stop offset="1" stop-color="#9149C6" />
    </linearGradient>
    <linearGradient id="tier3" x1="8.5" x2="44.2" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8E44C2" />
      <stop offset="1" stop-color="#6E2FA3" />
    </linearGradient>
    <!-- A pink glow towards the bottom right, like the Fluent colour database's sheen. -->
    <linearGradient id="sheen" x1="20" x2="40" y1="20" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset=".4" stop-color="#FF7AD0" stop-opacity="0" />
      <stop offset="1" stop-color="#FF7AD0" stop-opacity=".45" />
    </linearGradient>
    <linearGradient id="tagFill" x1="6" x2="30" y1="21" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF6FD" />
      <stop offset="1" stop-color="#FBCDEC" />
    </linearGradient>

    <!-- The tiers, top to bottom: the band between one lower arc and the next. -->
    <path id="t1" d="M8.53 7.5V18.375A17.81 5.81 0 0 0 44.15 18.375V7.5A17.81 5.81 0 0 1 8.53 7.5Z" />
    <path id="t2" d="M8.53 18.375V28.125A17.81 5.81 0 0 0 44.15 28.125V18.375A17.81 5.81 0 0 1 8.53 18.375Z" />
    <path id="t3" d="M8.53 28.125V38.25A17.81 5.81 0 0 0 44.15 38.25V28.125A17.81 5.81 0 0 1 8.53 28.125Z" />
    <clipPath id="clip2"><use href="#t2" /></clipPath>
    <clipPath id="clip3"><use href="#t3" /></clipPath>
    <clipPath id="clip1"><use href="#t1" /></clipPath>
  </defs>

  <!-- Database. -->
  <use href="#t3" fill="url(#tier3)" />
  <use href="#t2" fill="url(#tier2)" />
  <use href="#t1" fill="url(#tier1)" />
  <g fill="url(#sheen)">
    <use href="#t1" />
    <use href="#t2" />
    <use href="#t3" />
  </g>
  <!-- Soft shadow under each tier line. -->
  <g fill="none" stroke="#3A0F5C">
    <g clip-path="url(#clip1)">
      <path d="M8.53 7.5A17.81 5.81 0 0 0 44.15 7.5" stroke-width="3.2" stroke-opacity=".10" />
      <path d="M8.53 7.5A17.81 5.81 0 0 0 44.15 7.5" stroke-width="1.4" stroke-opacity=".14" />
    </g>
    <g clip-path="url(#clip2)">
      <path d="M8.53 18.375A17.81 5.81 0 0 0 44.15 18.375" stroke-width="3.2" stroke-opacity=".12" />
      <path d="M8.53 18.375A17.81 5.81 0 0 0 44.15 18.375" stroke-width="1.4" stroke-opacity=".18" />
    </g>
    <g clip-path="url(#clip3)">
      <path d="M8.53 28.125A17.81 5.81 0 0 0 44.15 28.125" stroke-width="3.2" stroke-opacity=".12" />
      <path d="M8.53 28.125A17.81 5.81 0 0 0 44.15 28.125" stroke-width="1.4" stroke-opacity=".18" />
    </g>
  </g>
  <ellipse cx="26.34" cy="7.5" rx="17.81" ry="5.81" fill="url(#cap)" />

  <!-- Tag, mirrored so it points down to the right like Search Explorer's magnifying glass handle, over the
       same area: light fill, thick dark outline, dark hole. -->
  <path
    transform="translate(32.65 17.56) scale(-0.64 0.64)"
    d="M23.49 7.24c.8-.8 1.88-1.24 3-1.24h11.26C40.1 6 42 7.9 42 10.25v11.26c0 1.12-.45 2.2-1.24 3L24.52 40.75a4.25 4.25 0 0 1-6.01 0L7.25 29.5a4.25 4.25 0 0 1 0-6.02z"
    fill="url(#tagFill)" stroke="#6A2A8E" stroke-width="4.1" stroke-linejoin="round" />
  <circle cx="11.21" cy="26.84" r="1.65" fill="#6A2A8E" />
</svg>
